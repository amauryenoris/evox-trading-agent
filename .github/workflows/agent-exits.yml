name: Exit Check — Open and Close

on:
  schedule:
    - cron: "30 13 * * 1-5"  # 9:30 AM ET
    - cron: "55 19 * * 1-5"  # 3:55 PM ET
  workflow_dispatch:

# Shared with agent-cron.yml: both can close the same positions, so they must never run at the same time.
# A pending run is replaced by a newer pending run; the cycle repeats the exit rules, so a dropped sweep is covered.
concurrency:
  group: trading-positions
  cancel-in-progress: false

jobs:
  exit-check:
    name: Exit Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # npm audit runs in security-audit.yml (daily, alerts via GitHub issue); it does not gate this workflow
      - run: npm run exit-only
