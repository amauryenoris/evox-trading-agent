name: Security Audit

on:
  schedule:
    - cron: "0 12 * * 1-5"  # 12:00 UTC weekdays, before the 13:30 UTC market open
  workflow_dispatch:
    inputs:
      audit_level:
        description: "Minimum severity that fails the audit (use moderate to test the alert)"
        type: choice
        options:
          - critical
          - high
          - moderate
          - low
        default: critical

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Validate audit level
        env:
          AUDIT_LEVEL: ${{ inputs.audit_level || 'critical' }}
        run: |
          case "$AUDIT_LEVEL" in
            low|moderate|high|critical) ;;
            *)
              echo "::error::audit_level must be one of: low, moderate, high, critical"
              exit 1
              ;;
          esac

      - name: Security audit
        id: audit
        continue-on-error: true
        env:
          AUDIT_LEVEL: ${{ inputs.audit_level || 'critical' }}
        run: |
          set -o pipefail
          npm audit --audit-level="$AUDIT_LEVEL" 2>&1 | tee audit.txt
      - name: Report critical advisory
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const ISSUE_TITLE = 'Security audit: critical advisory detected'

            let excerpt = '(audit.txt not found)'
            try {
              excerpt = fs.readFileSync('audit.txt', 'utf8').split('\n').slice(0, 60).join('\n')
            } catch (err) {
              excerpt = `(could not read audit.txt: ${err.message})`
            }
            const body = '```\n' + excerpt + '\n```'

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find(i => !i.pull_request && i.title === ISSUE_TITLE)

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Critical advisory still present:\n\n' + body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
              })
            }

      - name: Close resolved advisory
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ISSUE_TITLE = 'Security audit: critical advisory detected'

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find(i => !i.pull_request && i.title === ISSUE_TITLE)

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Audit is clean — no critical advisories found. Closing.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              })
            }

      - name: Fail the run on critical advisory
        if: steps.audit.outcome == 'failure'
        run: exit 1
