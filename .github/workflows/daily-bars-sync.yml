name: Daily Bars Sync

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 5:00 PM ET (EDT; adjust if this project's other crons account for EST separately)
  workflow_dispatch:

concurrency:
  group: daily-bars-sync
  cancel-in-progress: false

jobs:
  daily-bars-sync:
    name: Daily Bars Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_DAILY_BARS_SYNC: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # npm audit runs in security-audit.yml (daily, alerts via GitHub issue); it does not gate this workflow
      - run: npm run daily-bars-sync
